name: tests

on:
  push:
    branches: [main, windows]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Unit tests (includes the installer for this OS)
        run: uv run pytest -q -rs
